<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wörterspiel · 2A</title><meta name="description" content="Wörter und Partizip II aus Lektion 1 üben"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23274249'/%3E%3Ctext x='14' y='44' font-size='38' fill='white' font-family='sans-serif'%3EW%3C/text%3E%3C/svg%3E"><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#1c3035;background:#edf2f1}*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px}main{max-width:740px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}h1{font-size:1.5rem;line-height:1.25;margin:0}.sub{font-size:.9rem;color:#506569;margin:4px 0 0}.count{font-weight:700;white-space:nowrap;color:#285d65}.bar{height:8px;background:#d4e2e1;border-radius:20px;overflow:hidden;margin-bottom:24px}.fill{height:100%;background:#2c797f;width:0;transition:width .3s}.card{background:#fff;border:1px solid #d6e0de;border-radius:18px;padding:clamp(20px,5vw,38px);box-shadow:0 12px 35px #193b3f12}.label{text-transform:uppercase;letter-spacing:.09em;font-size:.8rem;font-weight:700;color:#447279;margin:0 0 12px}.prompt{font-size:clamp(1.25rem,3.2vw,1.7rem);line-height:1.5;font-weight:620;margin:0 0 28px}.gap{color:#207680;border-bottom:2px dashed #207680;padding:0 4px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answer{font:inherit;font-size:1rem;text-align:left;background:#f7faf9;border:1.5px solid #cddbd8;border-radius:12px;padding:15px 18px;min-height:58px;cursor:pointer;color:#193438}.answer:hover:not(:disabled),.answer:focus-visible{border-color:#23818b;background:#eaf6f4}.answer:disabled{cursor:default}.answer.correct{border-color:#2c8566;background:#e4f5ea}.answer.wrong{border-color:#bd6565;background:#fff0ef}.feedback{min-height:45px;margin:20px 0 0;font-weight:650}.feedback.good{color:#20714f}.feedback.bad{color:#a04d4d}.next{border:0;background:#234d55;color:white;border-radius:10px;padding:13px 24px;font:inherit;font-weight:700;cursor:pointer;min-height:48px}.next:hover{background:#176a74}.next[hidden]{display:none}.end{text-align:center}.end h2{font-size:1.8rem;margin:4px 0 10px}.end p{font-size:1.1rem;line-height:1.55}.foot{font-size:.87rem;color:#607075;margin:18px 5px}@media(max-width:560px){body{padding:16px}.answers{grid-template-columns:1fr}.top{align-items:flex-start}.card{padding:22px}}
</style></head><body><main><header class="top"><div><h1>Wörterspiel</h1><p class="sub">2A · Lektion 1 · Sitzung 2</p></div><div id="counter" class="count" aria-live="polite"></div></header><div class="bar" aria-hidden="true"><div id="fill" class="fill"></div></div><section class="card" id="card" aria-live="polite"></section><p class="foot">Wähle das passende Wort. Danach siehst du die Lösung.</p></main><script>
const bank=[
{q:'Wir haben uns für das kleinere Hotel _____.',a:'entschieden',opts:['entschieden','empfohlen','getroffen','verloren']},
{q:'Die Kellnerin hat uns die Tagessuppe _____.',a:'empfohlen',opts:['empfohlen','entschieden','getroffen','verloren']},
{q:'Marta hat einen Kuchen _____.',a:'mitgebracht',opts:['mitgebracht','teilgenommen','verloren','geholfen']},
{q:'Jonas hat an einem Fotokurs _____.',a:'teilgenommen',opts:['teilgenommen','getroffen','verloren','geholfen']},
{q:'Ich habe meinen Schlüssel _____.',a:'verloren',opts:['verloren','empfohlen','teilgenommen','geholfen']},
{q:'Leo ist erst um elf Uhr _____.',a:'aufgestanden',opts:['aufgestanden','mitgebracht','entschieden','teilgenommen']},
{q:'Wann seid ihr aus Berlin _____?',a:'zurückgekommen',opts:['zurückgekommen','getroffen','teilgenommen','verloren']},
{q:'Ein Mann hat uns sofort _____.',a:'geholfen',opts:['geholfen','empfohlen','verloren','teilgenommen']},
{q:'Wir haben im Urlaub interessante Leute _____.',a:'getroffen',opts:['getroffen','geholfen','aufgestanden','teilgenommen']},
{q:'Etwa die Hälfte macht einmal im Jahr eine _____.',a:'Urlaubsreise',opts:['Urlaubsreise','Regenschirm','Kindergeld','Arbeitnehmer']},
{q:'Paul hat _____ meinen Regenschirm genommen.',a:'aus Versehen',opts:['aus Versehen','im Durchschnitt','zum Essen','bei gutem Wetter']},
{q:'Hugo kommt später, weil er _____ hat.',a:'verschlafen',opts:['verschlafen','zurückgekommen','aufgestanden','teilgenommen']},
{q:'Die Menschen _____ bei gutem Wetter.',a:'sonnen sich',opts:['sonnen sich','helfen sich','empfehlen sich','verlieren sich']},
{q:'Für ihre Kinder bekommt Frau Müller _____.',a:'Kindergeld',opts:['Kindergeld','Urlaubsreise','Regenschirm','Arbeitnehmer']},
{q:'Im Durchschnitt haben _____ sechs Wochen Urlaub im Jahr.',a:'Arbeitnehmer',opts:['Arbeitnehmer','Regenschirme','Urlaubsreisen','Kurse']},
{q:'Es regnet. Hast du einen _____ dabei?',a:'Regenschirm',opts:['Regenschirm','Arbeitnehmer','Kindergeld','Urlaubsreise']}
];
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
let deck=shuffle(bank),i=0,score=0,locked=false;const card=document.querySelector('#card'),counter=document.querySelector('#counter'),fill=document.querySelector('#fill');
function show(){locked=false;counter.textContent=`${i+1} / ${deck.length}`;fill.style.width=(i/deck.length*100)+'%';const item=deck[i];card.innerHTML='<p class="label">Welches Wort passt?</p><p class="prompt"></p><div class="answers"></div><p class="feedback" role="status"></p><button class="next" hidden>Weiter</button>';const p=card.querySelector('.prompt');const [before,after]=item.q.split('_____');p.append(document.createTextNode(before));const gap=document.createElement('span');gap.className='gap';gap.textContent='?';p.append(gap,document.createTextNode(after));for(const choice of shuffle(item.opts)){const b=document.createElement('button');b.className='answer';b.textContent=choice;b.addEventListener('click',()=>answer(b,choice));card.querySelector('.answers').append(b)}card.querySelector('.next').addEventListener('click',()=>{i++;i<deck.length?show():finish()})}
function answer(btn,value){if(locked)return;locked=true;const right=value===deck[i].a;if(right)score++;for(const b of card.querySelectorAll('.answer')){b.disabled=true;if(b.textContent===deck[i].a)b.classList.add('correct')}if(!right)btn.classList.add('wrong');const f=card.querySelector('.feedback');f.className='feedback '+(right?'good':'bad');f.textContent=right?'Richtig!':'Noch nicht. Die richtige Antwort ist grün markiert.';const next=card.querySelector('.next');next.hidden=false;next.textContent=i===deck.length-1?'Ergebnis ansehen':'Weiter';next.focus()}
function finish(){counter.textContent='Fertig';fill.style.width='100%';card.innerHTML='<div class="end"><p class="label">Geschafft!</p><h2>'+score+' von '+deck.length+' richtig</h2><p>'+ (score>=13?'Stark! Die Wörter sitzen schon gut.':'Schau dir die Beispielsätze noch einmal an und versuche es erneut.')+'</p><button class="next">Noch einmal spielen</button></div>';card.querySelector('button').addEventListener('click',()=>{deck=shuffle(bank);i=0;score=0;show()})}show();
</script></body></html>
