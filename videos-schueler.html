<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Video ansehen</title><style>body{font:18px Arial;background:#f6f9fa;color:#193448}main{max-width:900px;margin:auto;padding:20px}iframe{width:100%;aspect-ratio:16/9;border:0}a{color:#16756e}</style><main><h1 id="title">Video ansehen</h1><p id="intro"></p><div id="player"></div><p id="fallback"></p><p>Sieh den Ausschnitt zweimal und bearbeite dein Arbeitsblatt. Untertitel kannst du im Videoplayer ein- oder ausschalten.</p></main><script>const data={"1":[["28OULOcAS3Y",59,279,"Wer Freunde hat, lebt länger?"],["S9sfP4w1mi8",48,270,"Wie gut passt du zu deinen Freunden?"],["ZpKlnLRMa44",33,233,"Braucht man beste Freunde?"],["fOTCJOMSluk",55,254,"Zwischen Likes und Einsamkeit"],["Y0pq6QPFOTc",31,192,"Eine Beziehung mit einer KI"],["xkQr03JQKjg",3,238,"Gemeinsam gegen Einsamkeit"],["TqJR-vSRHE8",102,300,"Carolin Kebekus über Einsamkeit"]],"2":[["h3qh1zvVkvg",46,221,"Spätschicht in der Bäckerei"],["YdVYg3nj3j8",22,208,"Was bringt die Vier-Tage-Woche?"],["nSyJPleHOwg",62,221,"Wenn die Arbeit unglücklich macht"],["dft8ikD9U2A",3,155,"Unternehmenskultur: Vielfalt als Vorteil"],["17VhFfVXZrM",493,724,"Zerstört die Generation Z die Arbeitswelt?"]]};const q=new URLSearchParams(location.search),lesson=q.get('lektion')||'1',num=Number(q.get('video')||'1');const v=data[lesson]?.[num-1];if(v){document.getElementById('title').textContent=v[3];const clock=n=>Math.floor(n/60)+':'+String(n%60).padStart(2,'0');document.getElementById('intro').textContent='Video '+num+' · Ausschnitt '+clock(v[1])+'–'+clock(v[2]);const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+v[0]+'?start='+v[1]+'&end='+v[2]+'&rel=0&playsinline=1';f.title=v[3];f.allow='autoplay; encrypted-media; picture-in-picture';f.allowFullscreen=true;document.getElementById('player').appendChild(f);const a=document.createElement('a');a.href='https://www.youtube.com/watch?v='+v[0]+'&t='+v[1]+'s';a.textContent='Falls der Player nicht startet: Video direkt auf YouTube öffnen';a.target='_blank';a.rel='noopener';document.getElementById('fallback').appendChild(a);document.getElementById('fallback').append(' · bei '+clock(v[2])+' stoppen.');}else document.getElementById('intro').textContent='Dieses Video wurde nicht gefunden.';</script></html>
