<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Freundschaft · Wortschatz</title><style>body{font:18px system-ui;background:#f5f8f7;color:#183c35;margin:0}main{max-width:700px;margin:30px auto;padding:24px}button{font:inherit;background:white;border:2px solid #b7ccc5;border-radius:12px;padding:14px;margin:8px 0;width:100%;cursor:pointer}button:hover{border-color:#246d58}button:disabled{cursor:default}h1{font-size:30px}#card{background:white;padding:24px;border-radius:20px}#feedback{min-height:65px}progress{width:100%}.small{font-size:15px}</style><main><p>4A · B2.1</p><h1>Freundschaft: Wortschatz trainieren</h1><p>16 Wörter, zwei Runden: Bedeutung erkennen und im Satz verwenden. Ohne Zeitdruck.</p><div id="card"><button onclick="start()">Los geht's!</button></div></main><script>
const data=[["das Wohlbefinden","das Gefühl, dass es einem körperlich und seelisch gut geht","Gute Gespräche verbessern mein ___.","Wohlbefinden"],["im Schnitt","durchschnittlich","___ treffen wir uns zweimal im Monat.","Im Schnitt"],["der Freundeskreis, -e","die Menschen, mit denen man befreundet ist","Nach meinem Umzug wurde mein ___ größer.","Freundeskreis"],["zuordnen","einer Gruppe oder Kategorie zuweisen","Diese Kontakte kann ich meinem engen Freundeskreis ___.","zuordnen"],["die Lebensphase, -n","ein Abschnitt im Leben","Der Berufseinstieg ist eine neue ___.","Lebensphase"],["spiegeln","zeigen, wie jemand ist oder sich verändert hat","Alte Freunde können uns unsere Entwicklung ___.","spiegeln"],["die Bekanntschaft, -en","ein Kontakt zu einer Person, die man noch nicht gut kennt","Aus einer lockeren ___ wurde eine enge Freundschaft.","Bekanntschaft"],["zu dem Schluss kommen","nach längerem Nachdenken ein Ergebnis finden","Nach dem Gespräch bin ich ___, dass wir mehr Zeit brauchen.","zu dem Schluss gekommen"],["bewusst","mit Absicht und nach Überlegung","Ich habe mich ___ für mehr gemeinsame Zeit entschieden.","bewusst"],["freiwillig","weil man selbst möchte; ohne Zwang","Wir treffen uns ___, nicht weil wir zusammen arbeiten müssen.","freiwillig"],["das Selbstwertgefühl","das Gefühl, selbst wertvoll und wichtig zu sein","Wenn Freunde mich ernst nehmen, stärkt das mein ___.","Selbstwertgefühl"],["jemandem etwas anvertrauen","jemandem etwas Persönliches im Vertrauen erzählen","Ich kann dir mein Geheimnis ___.","anvertrauen"],["verletzlich","leicht emotional zu verletzen","Wer über seine Ängste spricht, macht sich ___.","verletzlich"],["die Gegenseitigkeit","beide Seiten geben und bekommen etwas","Wenn immer nur einer hilft, fehlt die ___.","Gegenseitigkeit"],["das Ungleichgewicht, -e","ein Zustand, in dem beide Seiten unterschiedlich viel geben","Wenn eine Person viel mehr gibt, entsteht ein ___.","Ungleichgewicht"],["etwas aushalten","mit einer schwierigen Situation zurechtkommen","Eine stabile Freundschaft kann schwierige Zeiten ___.","aushalten"]];let tasks=[],pos=0,score=0,wrong=[],locked=false;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function start(retry=false){tasks=retry?shuffle(wrong):[...shuffle(data.map((d,i)=>({i,mode:0}))),...shuffle(data.map((d,i)=>({i,mode:1})))];pos=0;score=0;wrong=[];show()}
function show(){locked=false;if(pos===tasks.length){document.getElementById('card').innerHTML='<h2>Geschafft!</h2><p>'+score+' von '+tasks.length+' richtig.</p>'+(wrong.length?'<button onclick="start(true)">Fehler noch einmal üben</button>':'<p>Alle Antworten richtig!</p>')+'<button onclick="start()">Neu spielen</button>';return}
const t=tasks[pos],d=data[t.i];let correct=t.mode?d[3]:d[0];let options=t.mode?shuffle([correct,...shuffle(data.filter((_,i)=>i!==t.i).map(x=>x[3])).slice(0,3)]):shuffle([correct,...shuffle(data.filter((_,i)=>i!==t.i).map(x=>x[0])).slice(0,3)]);
document.getElementById('card').innerHTML='<p class="small">Aufgabe '+(pos+1)+' / '+tasks.length+' · '+(t.mode?'Im Satz':'Bedeutung')+'</p><progress max="'+tasks.length+'" value="'+pos+'"></progress><h2>'+(t.mode?d[2]:d[1])+'</h2><div id="options"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden onclick="pos++;show()">Weiter</button>';
options.forEach(o=>{const b=document.createElement('button');b.textContent=o;b.onclick=()=>{if(locked)return;locked=true;const good=o===correct;if(good)score++;else wrong.push(t);b.style.background=good?'#d7eee1':'#fde4df';document.querySelectorAll('#options button').forEach(x=>x.disabled=true);document.getElementById('feedback').textContent=good?'Richtig!':('Die richtige Antwort: '+correct);document.getElementById('next').hidden=false};document.getElementById('options').appendChild(b)})}</script></html>
