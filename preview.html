<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zweiteilige Konnektoren · B2.1</title>
<style>
:root{--ink:#1e2832;--rose:#a63d40;--pale:#fbf5f2;--blue:#234a6b;--ok:#26734d;--bad:#9b2c2c}
*{box-sizing:border-box}body{margin:0;background:var(--pale);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.45}
header{background:var(--blue);color:#fff;padding:24px max(20px,calc((100vw - 920px)/2))}header h1{margin:0 0 5px;font-size:clamp(25px,4vw,38px)}header p{margin:0;opacity:.9}
main{max-width:920px;margin:24px auto;padding:0 18px 45px}.top{display:flex;gap:12px;justify-content:space-between;align-items:center;margin-bottom:15px}.badge{background:#fff;border:1px solid #dbc9c4;border-radius:999px;padding:7px 12px;font-weight:700}
.bar{height:9px;background:#eadfdb;border-radius:9px;overflow:hidden;margin-bottom:22px}.bar span{display:block;height:100%;background:var(--rose);width:0;transition:.25s}
.card{background:#fff;border:1px solid #dbc9c4;border-radius:16px;padding:clamp(20px,4vw,34px);box-shadow:0 8px 25px #623b2b14}.kind{color:var(--rose);font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}.question{font-size:clamp(21px,3vw,29px);font-weight:700;margin:12px 0 22px}
.answers{display:grid;gap:11px}.answers button{border:2px solid #d9dde1;background:#fff;border-radius:11px;padding:14px 16px;text-align:left;font-size:17px;cursor:pointer}.answers button:hover{border-color:var(--blue);background:#f4f8fb}.answers button:disabled{cursor:default}.answers .right{border-color:var(--ok);background:#eaf6ef}.answers .wrong{border-color:var(--bad);background:#fdeeee}
.feedback{min-height:54px;margin-top:18px;font-size:16px}.feedback strong{display:block}.next{display:none;margin-left:auto;border:0;border-radius:10px;background:var(--blue);color:#fff;padding:12px 20px;font-size:16px;font-weight:700;cursor:pointer}
.result{text-align:center}.result h2{font-size:34px;margin:5px}.result .score{font-size:64px;color:var(--rose);font-weight:800}.result button{border:0;border-radius:10px;background:var(--blue);color:#fff;padding:13px 22px;font-size:17px;font-weight:700;cursor:pointer}
@media print{header,.next,.bar,.top{display:none}.card{box-shadow:none}}
</style>
</head>
<body>
<header><h1>Zweiteilige Konnektoren</h1><p>15 Aufgaben · Lektion 1 · B2.1</p></header>
<main>
  <div class="top"><span class="badge" id="progress">Aufgabe 1 von 15</span><span class="badge" id="score">0 Punkte</span></div>
  <div class="bar"><span id="bar"></span></div>
  <section class="card" id="card"></section>
</main>
<script>
const Q=[
{k:"Bedeutung",q:"Welcher Konnektor zählt zwei gleich wichtige positive Aspekte auf?",a:["sowohl … als auch","weder … noch","entweder … oder","zwar …, aber"],r:0,e:"„Sowohl … als auch“ verbindet zwei positive, gleichgewichtete Informationen."},
{k:"Bedeutung",q:"Welcher Konnektor verneint zwei Möglichkeiten gleichzeitig?",a:["nicht nur …, sondern auch","einerseits …, andererseits","weder … noch","entweder … oder"],r:2,e:"„Weder … noch“ enthält bereits die Verneinung."},
{k:"Bedeutung",q:"Welcher Konnektor drückt eine Wahl zwischen zwei Möglichkeiten aus?",a:["zwar …, aber","entweder … oder","sowohl … als auch","weder … noch"],r:1,e:"„Entweder … oder“ stellt zwei Alternativen gegenüber."},
{k:"Bedeutung",q:"Welcher Konnektor schränkt die erste Aussage durch die zweite ein?",a:["zwar …, aber","sowohl … als auch","weder … noch","einerseits …, andererseits"],r:0,e:"„Zwar …, aber“ signalisiert eine Einschränkung oder einen Gegensatz."},
{k:"Bedeutung",q:"Welcher Konnektor betrachtet zwei unterschiedliche Seiten derselben Frage?",a:["entweder … oder","nicht nur …, sondern auch","einerseits …, andererseits","sowohl … als auch"],r:2,e:"„Einerseits …, andererseits“ eignet sich besonders für eine Abwägung."},
{k:"Im Satz",q:"Eine gute Freundschaft braucht ___ Vertrauen ___ Zeit.",a:["weder … noch","sowohl … als auch","zwar …, aber","entweder … oder"],r:1,e:"Vertrauen und Zeit werden als zwei gleich wichtige Voraussetzungen genannt."},
{k:"Im Satz",q:"Nach dem Streit wollten wir ___ telefonieren ___ Nachrichten schreiben.",a:["weder … noch","sowohl … als auch","nicht nur …, sondern auch","einerseits …, andererseits"],r:0,e:"Beide Möglichkeiten werden verneint: weder telefonieren noch Nachrichten schreiben."},
{k:"Im Satz",q:"Wir treffen uns heute ___ im Café ___ im Park; für beides reicht die Zeit nicht.",a:["einerseits …, andererseits","zwar …, aber","entweder … oder","sowohl … als auch"],r:2,e:"Es muss eine von zwei Möglichkeiten gewählt werden."},
{k:"Im Satz",q:"Wir wohnen ___ weit voneinander entfernt, ___ unsere Freundschaft ist sehr eng.",a:["zwar …, aber","weder … noch","sowohl … als auch","entweder … oder"],r:0,e:"Die zweite Aussage schränkt die erwartbare Folge der ersten ein."},
{k:"Im Satz",q:"___ schätze ich ihre Offenheit, ___ verletzt mich ihre direkte Art manchmal.",a:["Sowohl … als auch","Einerseits …, andererseits","Weder … noch","Nicht nur …, sondern auch"],r:1,e:"Hier werden eine positive und eine problematische Seite abgewogen."},
{k:"Im Satz",q:"Der zweite positive Punkt soll besonders hervorgehoben werden: Nora ist ___ zuverlässig, ___ geduldig.",a:["nicht nur …, sondern auch","weder … noch","entweder … oder","zwar …, aber"],r:0,e:"Mit „nicht nur …, sondern auch“ erhält der zweite positive Aspekt besonderes Gewicht."},
{k:"Bedeutung",q:"Welche Aussage hebt Geduld als zusätzliche Stärke besonders hervor?",a:["Nora ist sowohl zuverlässig als auch geduldig.","Nora ist nicht nur zuverlässig, sondern auch geduldig.","Nora ist weder zuverlässig noch geduldig.","Nora ist zwar zuverlässig, aber nicht immer geduldig."],r:1,e:"„Nicht nur …, sondern auch“ hebt die zweite Information stärker hervor. Alle vier Sätze sind grammatisch möglich, drücken aber etwas anderes aus."},
{k:"Bedeutung",q:"Welche Aussage stellt zwei mögliche Formen des Kontakts zur Wahl?",a:["Wir telefonieren sowohl heute als auch morgen.","Wir telefonieren weder heute noch morgen.","Entweder treffen wir uns morgen oder wir telefonieren heute.","Wir telefonieren zwar heute, aber nur kurz."],r:2,e:"Nur „entweder … oder“ formuliert eine Wahl zwischen zwei Möglichkeiten."},
{k:"Bedeutung",q:"Welche Aussage formuliert eine Einschränkung?",a:["Sie meldet sich sowohl morgens als auch abends.","Sie meldet sich weder am Wochenende noch im Urlaub.","Sie meldet sich entweder telefonisch oder per Nachricht.","Sie meldet sich zwar selten, aber sie hört immer aufmerksam zu."],r:3,e:"„Zwar …, aber“ verbindet hier eine Einschränkung mit einer positiven Aussage."},
{k:"Transfer",q:"Du möchtest zwei Vorteile gleich gewichten. Welche Formulierung passt?",a:["Die Freundschaft gibt mir zwar Sicherheit, aber neue Perspektiven.","Die Freundschaft gibt mir sowohl Sicherheit als auch neue Perspektiven.","Die Freundschaft gibt mir weder Sicherheit noch neue Perspektiven.","Die Freundschaft gibt mir entweder Sicherheit oder neue Perspektiven."],r:1,e:"Beide Vorteile gelten gleichzeitig und erhalten dasselbe Gewicht."}
];
let i=0,pts=0;
const card=document.querySelector('#card'),progress=document.querySelector('#progress'),score=document.querySelector('#score'),bar=document.querySelector('#bar');
function show(){const x=Q[i];progress.textContent=`Aufgabe ${i+1} von ${Q.length}`;score.textContent=`${pts} Punkte`;bar.style.width=`${i/Q.length*100}%`;card.innerHTML=`<div class="kind">${x.k}</div><div class="question">${x.q}</div><div class="answers">${x.a.map((v,n)=>`<button data-n="${n}">${v}</button>`).join('')}</div><div class="feedback" id="fb"></div><button class="next" id="next">${i===Q.length-1?'Ergebnis':'Weiter'}</button>`;card.querySelectorAll('.answers button').forEach(b=>b.onclick=()=>answer(+b.dataset.n));document.querySelector('#next').onclick=next}
function answer(n){const x=Q[i],bs=[...card.querySelectorAll('.answers button')];bs.forEach(b=>b.disabled=true);bs[x.r].classList.add('right');if(n!==x.r)bs[n].classList.add('wrong');else pts++;document.querySelector('#fb').innerHTML=`<strong>${n===x.r?'Richtig!':'Noch nicht.'}</strong>${x.e}`;document.querySelector('#next').style.display='block';score.textContent=`${pts} Punkte`}
function next(){i++;if(i<Q.length)show();else result()}
function result(){bar.style.width='100%';progress.textContent='Geschafft';let msg=pts>=13?'Sehr sicher.':pts>=10?'Gute Grundlage.':'Einige Verbindungen solltest du noch einmal ansehen.';card.innerHTML=`<div class="result"><h2>${msg}</h2><div class="score">${pts}/15</div><p>Besprecht offene Fragen kurz zu zweit oder mit der Lehrkraft.</p><button onclick="i=0;pts=0;show()">Noch einmal</button></div>`}
show();
</script>
</body>
</html>
