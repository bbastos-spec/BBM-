<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2B · Wortschatz 28. September</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5fc;color:#18334e;font:20px/1.5 system-ui}main{max-width:850px;margin:35px auto;padding:24px}h1{font-size:42px;line-height:1.15}button{font:inherit;border:2px solid #2469ad;border-radius:12px;background:white;color:#18334e;padding:15px;cursor:pointer}button:disabled{cursor:default}#opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}section{background:white;padding:30px;border-radius:20px}#q{font-size:27px;font-weight:700}#fb{min-height:65px;margin-top:20px}.good{background:#dcf5e6}.bad{background:#ffe0df}.small{font-size:17px}@media(max-width:550px){main{margin:10px auto;padding:14px}section{padding:22px}#opts{grid-template-columns:1fr}h1{font-size:34px}}summary{cursor:pointer;font-weight:700}li{margin:12px 0}</style><main><p class="small">2B · Montag, 28. September 2026</p><h1>Wortschatz im Kopf</h1><section id="game"><p>Zu zweit mit einem Handy. Erst besprechen, dann antworten.</p><p>14 Wörter · 24 Fragen</p><button onclick="start()">Los geht’s!</button></section><details><summary>Die 14 Wörter</summary><ul id="words"></ul></details></main><script>const vocab=[["der Helm", "Man trägt ihn auf dem Kopf beim Fahrradfahren."], ["die Kaution", "Geld als Sicherheit. Man bekommt es später zurück."], ["versichert", "Bei einem Unfall bezahlt die Versicherung."], ["reservieren", "Etwas für später buchen, zum Beispiel ein Fahrrad."], ["die Kreditkarte", "Eine Karte, mit der man bezahlen kann."], ["herunterladen", "Eine App aus dem Internet auf das Handy holen."], ["sich registrieren", "Ein Konto mit den eigenen Daten erstellen."], ["auswählen", "Sich für eine Möglichkeit entscheiden."], ["eingeben", "Eine PIN oder ein Passwort tippen."], ["der Termin", "Ein Treffen zu einer bestimmten Zeit."], ["übernachten", "Eine Nacht an einem Ort schlafen."], ["klappen", "Gut funktionieren."], ["die Kreuzung", "Hier treffen sich zwei oder mehrere Straßen."], ["das Kaufhaus", "Ein großes Geschäft mit vielen verschiedenen Waren."]];const context=[["Beim Fahrradfahren trage ich einen ___.", "Helm"], ["Bevor ich das Auto miete, bezahle ich eine ___.", "Kaution"], ["Ich möchte ein Fahrrad für Samstag ___.", "reservieren"], ["Kann ich mit einer ___ bezahlen?", "Kreditkarte"], ["Zuerst muss ich die App ___.", "herunterladen"], ["Dann muss ich mich mit meinem Namen ___.", "registrieren"], ["Ich muss die PIN ___.", "eingeben"], ["Ich kann bei dir ___. Dann brauche ich kein Hotel.", "übernachten"], ["Ich habe um 10 Uhr einen ___ beim Arzt.", "Termin"], ["An der ___ gehe ich nach rechts.", "Kreuzung"]];let tasks=[],i=0,score=0,locked=false;const g=document.getElementById('game');function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function start(){tasks=vocab.map(([a,q])=>({q,a,opts:shuffle([a,...shuffle(vocab.map(x=>x[0]).filter(x=>x!==a)).slice(0,3)])})).concat(context.map(([q,a])=>({q,a,opts:shuffle([a,...shuffle(context.map(x=>x[1]).filter(x=>x!==a)).slice(0,3)])})));i=score=0;draw()}function draw(){locked=false;if(i===tasks.length){g.innerHTML='<h2>'+score+' / '+tasks.length+'</h2><p>Schaut euch die Wörter noch einmal an.</p><button onclick="start()">Noch einmal</button>';return}const x=tasks[i];g.innerHTML='<p class="small">'+(i<14?'Runde 1 · Was bedeutet das?':'Runde 2 · Welches Wort passt?')+' · '+(i+1)+' / '+tasks.length+'</p><p id="q"></p><div id="opts"></div><div id="fb" aria-live="polite"></div>';document.getElementById('q').textContent=x.q;x.opts.forEach(o=>{let b=document.createElement('button');b.textContent=o;b.onclick=()=>answer(b,o);document.getElementById('opts').append(b)})}function answer(b,o){if(locked)return;locked=true;const x=tasks[i],ok=o===x.a;if(ok)score++;document.querySelectorAll('#opts button').forEach(z=>{z.disabled=true;if(z.textContent===x.a)z.classList.add('good')});if(!ok)b.classList.add('bad');const f=document.getElementById('fb');f.textContent=ok?'Richtig!':'Die Antwort: '+x.a;const n=document.createElement('button');n.textContent='Weiter';n.onclick=()=>{i++;draw()};g.append(n)}vocab.forEach(([w,d])=>{let l=document.createElement('li');let b=document.createElement('b');b.textContent=w;l.append(b,document.createTextNode(' — '+d));document.getElementById('words').append(l)});</script></html>
