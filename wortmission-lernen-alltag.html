<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#156858"><title>Wortmission</title><style>
:root{--ink:#19362f;--green:#156858;--cream:#fffdf4;--orange:#ff7957;--lime:#d9ee9b}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:18px/1.5 system-ui,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible,a:focus-visible{outline:4px solid #f08c16;outline-offset:4px}header{max-width:1050px;margin:auto;padding:24px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:850;font-size:21px}.status{font-size:14px;background:#e7efdf;border-radius:30px;padding:8px 15px}main{max-width:950px;margin:auto;padding:28px 24px 65px}.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:800;color:var(--green)}h1{font-size:clamp(44px,8vw,82px);line-height:1.05;letter-spacing:-.055em;margin:18px 0 24px}h2{font-size:clamp(29px,5vw,45px);line-height:1.2;letter-spacing:-.025em;margin:15px 0 22px}p{max-width:620px}.lead{font-size:21px;color:#50665d}.primary{background:var(--green);color:white;border:0;padding:16px 28px;border-radius:40px;font-weight:750;min-height:54px}.secondary{background:white;border:1px solid #b7c7b6;border-radius:30px;padding:12px 22px}.hero{display:grid;grid-template-columns:1.5fr 1fr;align-items:center;gap:25px}.art{width:100%;max-width:320px}.meta{display:flex;flex-wrap:wrap;gap:10px;margin:30px 0}.meta span{font-size:14px;border:1px solid #c4d1bb;border-radius:25px;padding:8px 12px}.progress{height:7px;background:#e5e9da;border-radius:10px;margin:0 0 25px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green);transition:width .3s}.pairgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.column{display:grid;gap:12px}.tile{width:100%;min-height:76px;text-align:left;border:1.5px solid #bbcab5;border-radius:15px;padding:15px 18px;background:white;font-size:18px;transition:background .15s}.tile.word{font-weight:750}.tile.selected{border:3px solid var(--green);padding:13.5px 16.5px;background:#eef4df}.tile.done{background:#dcebbf;border-color:#90ad6b;cursor:default}.tile:disabled{color:#41543a;opacity:1}.feedback{min-height:65px;padding:17px 0;font-weight:650}.feedback.good{color:#206046}.feedback.retry{color:#914021}.answers{display:grid;gap:13px;margin:25px 0}.answers button{min-height:68px}.context{font-size:clamp(23px,4vw,33px);line-height:1.5;max-width:760px;background:#edf1e2;border-radius:20px;padding:28px}.context strong{border-bottom:3px solid var(--orange);display:inline-block;min-width:100px;text-align:center}.hint{font-size:15px;color:#596d61}.bottom{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.collection{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0}.collection span{padding:10px 16px;border-radius:25px;background:#e3edcb;font-weight:650}.small{font-size:14px;color:#627064}footer{max-width:950px;margin:auto;padding:0 24px 25px;font-size:13px;color:#647264}dialog{max-width:700px;width:90%;border:0;border-radius:20px;padding:30px;color:var(--ink)}dialog::backdrop{background:#132d27aa}.vocabrow{padding:10px 0;border-bottom:1px solid #dde4d6}.vocabrow b{display:block}svg{overflow:visible}@media(max-width:650px){header{padding:18px}.hero{grid-template-columns:1fr}.art{max-width:180px;grid-row:1;justify-self:center}main{padding-top:10px}.lead{font-size:18px}.pairgrid{gap:8px;grid-template-columns:1fr 1.25fr}.tile{padding:11px;font-size:15px;min-height:105px}.tile.selected{padding:9.5px}.status{font-size:12px}.context{padding:21px}.logo{font-size:19px}}
</style></head><body><header><div class="logo">Wortmission<span style="color:var(--orange)"> ✳</span></div><div class="status" id="status">Gemeinsam ans Ziel</div></header><main id="app"></main><footer><button class="secondary" id="listBtn">Wörter ansehen</button></footer><dialog id="dialog"><h2>Die zehn Wörter</h2><div id="vocab"></div><p><button class="primary" id="close">Schließen</button></p></dialog><script>
const words=[
{id:0,w:'verschieben',d:'Etwas später machen als geplant.'},
{id:1,w:'tagsüber',d:'Am Tag, nicht in der Nacht.'},
{id:2,w:'der Stoff',d:'Alles, was man für einen Kurs oder eine Prüfung lernt.'},
{id:3,w:'kapieren',d:'Etwas verstehen.'},
{id:4,w:'durchatmen',d:'Ruhig und tief atmen.'},
{id:5,w:'freimachen',d:'Platz oder Zeit für etwas schaffen.'},
{id:6,w:'zurechtkommen',d:'Mit einer Situation oder Aufgabe gut umgehen können.'},
{id:7,w:'übrigens',d:'So beginnt man eine zusätzliche Information.'},
{id:8,w:'unternehmen',d:'Etwas machen, zum Beispiel einen Ausflug.'},
{id:9,w:'der Prüfer / die Prüferin',d:'Diese Person stellt Fragen und bewertet die Prüfung.'}];
const tasks=[
{id:0,q:'Der Kurs kann heute nicht stattfinden. Wir ___ ihn auf morgen.',o:['verschieben','kapieren','unternehmen'],a:'verschieben',why:'Der Kurs findet später statt: Wir verschieben ihn auf morgen.'},
{id:9,q:'Bei der mündlichen Prüfung stellt mir ___ Fragen und bewertet meine Antworten.',o:['die Prüferin','die Kurskollegin','die Nachbarin'],a:'die Prüferin',why:'Die Prüferin bewertet die Prüfung.'},
{id:4,q:'Ich bin vor der Prüfung nervös. Ich möchte erst einmal ruhig ___.',o:['durchatmen','verschieben','unternehmen'],a:'durchatmen',why:'Ruhig und tief atmen hilft mir in dieser Situation.'},
{id:2,q:'Die Prüfung ist am Freitag. Bis dahin muss ich den ganzen ___ wiederholen.',o:['Stoff','Stuhl','Ausflug'],a:'Stoff',why:'Der Stoff ist hier alles, was wir für die Prüfung lernen.'},
{id:6,q:'„Wie kommst du mit deinem neuen Lernplan ___?“ – „Gut, er hilft mir sehr.“',o:['zurecht','durch','frei'],a:'zurecht',why:'Mit etwas zurechtkommen: „Ich komme gut mit dem Lernplan zurecht.“'},
{id:1,q:'Ich arbeite nachts im Krankenhaus. Deshalb schlafe ich ___.',o:['tagsüber','übrigens','zusammen'],a:'tagsüber',why:'Tagsüber bedeutet: am Tag.'},
{id:8,q:'Am Samstag wollen wir etwas zusammen ___. Vielleicht fahren wir an den See.',o:['unternehmen','kapieren','verschieben'],a:'unternehmen',why:'Etwas zusammen unternehmen: zum Beispiel einen Ausflug machen.'},
{id:3,q:'Danke für die Erklärung! Jetzt ___ ich endlich die Regel.',o:['kapiere','verschiebe','unternehme'],a:'kapiere',why:'Kapieren bedeutet verstehen: Jetzt verstehe ich die Regel.'},
{id:5,q:'Am Freitag möchte ich lernen. Dafür mache ich mir den Nachmittag ___.',o:['frei','zurecht','durch'],a:'frei',why:'Ich mache mir Zeit frei: Ich plane in dieser Zeit keine anderen Termine.'},
{id:7,q:'Wir sprechen gerade über Hausaufgaben. Mir fällt noch etwas anderes ein: „___: Morgen beginnt der Kurs früher.“',o:['Übrigens','Tagsüber','Zusammen'],a:'Übrigens',why:'Mit „übrigens“ ergänze ich eine zusätzliche Information.'}];
const app=document.querySelector('#app');let phase=0,board=0,chosen=null,matched=new Set(),index=0,learned=new Set(),mistakes=0,answered=false,order=[];const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function progress(n){return `<div class="progress" role="progressbar" aria-label="Fortschritt" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="20"><i style="width:${n/20*100}%"></i></div>`}
function start(){app.innerHTML=`<div class="hero"><div><div class="eyebrow">Zehn Wörter. Zwei Runden.</div><h1>Gemeinsam<br>auf Wortmission.</h1><p class="lead">Findet die passenden Bedeutungen. Setzt dann die Wörter in Alltagssituationen ein.</p><div class="meta"><span>Zu zweit</span><span>Ohne Zeitdruck</span><span>Neue Versuche erlaubt</span></div><button class="primary" id="go">Mission starten</button><p class="small">Lest abwechselnd vor. Entscheidet gemeinsam.</p></div><svg class="art" viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="135" fill="#e1ecbe"/><path d="M72 222 Q110 188 103 150 Q85 90 185 100 Q245 110 223 55" fill="none" stroke="#156858" stroke-width="6" stroke-dasharray="8 10"/><rect x="47" y="177" width="90" height="68" rx="13" fill="#ff7957" transform="rotate(-12 90 210)"/><text x="74" y="226" font-size="40" font-family="system-ui" font-weight="800" fill="#19362f">Aa</text><path d="M207 44 v65 M209 45 l54 14 -54 21" stroke="#19362f" stroke-width="5" fill="#ffb940"/><circle cx="176" cy="130" r="28" fill="#fffdf4"/><path d="M164 130 l9 10 16 -21" fill="none" stroke="#156858" stroke-width="6"/><path d="M201 225 l8 -18 9 18 20 3 -15 15 3 20 -17 -10 -19 10 4 -20 -15 -15z" fill="#ffb940"/></svg></div>`;document.querySelector('#go').onclick=()=>{phase=1;showBoard()}}
function showBoard(){chosen=null;matched=new Set();order=shuffle(words.slice(board*5,board*5+5));renderBoard()}
function renderBoard(){let group=words.slice(board*5,board*5+5);app.innerHTML=progress(board*5+matched.size)+`<div class="eyebrow">Runde 1 · Wortpaare · ${board+1} / 2</div><h2>Was gehört zusammen?</h2><p class="hint">Tippt links auf ein Wort und rechts auf die passende Erklärung.</p><div class="pairgrid"><div class="column">${group.map(x=>`<button class="tile word ${matched.has(x.id)?'done':''} ${chosen===x.id?'selected':''}" data-word="${x.id}" ${matched.has(x.id)?'disabled':''}>${matched.has(x.id)?'✓ ':''}${x.w}</button>`).join('')}</div><div class="column">${order.map(x=>`<button class="tile ${matched.has(x.id)?'done':''}" data-def="${x.id}" ${matched.has(x.id)?'disabled':''}>${x.d}</button>`).join('')}</div></div><div class="feedback" id="feedback" aria-live="polite"></div><div id="continue"></div>`;document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>{chosen=Number(b.dataset.word);document.querySelectorAll('[data-word]').forEach(z=>z.classList.toggle('selected',Number(z.dataset.word)===chosen))});document.querySelectorAll('[data-def]').forEach(b=>b.onclick=()=>match(Number(b.dataset.def)))}
function feedback(t,good){let f=document.querySelector('#feedback');f.className='feedback '+(good?'good':'retry');f.textContent=t}
function match(id){if(chosen===null){feedback('Wählt zuerst links ein Wort.',false);return}if(id!==chosen){mistakes++;feedback('Das passt noch nicht. Besprecht euch und versucht es noch einmal.',false);return}matched.add(id);chosen=null;renderBoard();feedback('✓ Das passt!',true);if(matched.size===5){document.querySelector('#continue').innerHTML='<button class="primary" id="next">'+(board===0?'Die nächsten fünf Wörter':'Weiter zu den Alltagssituationen')+'</button>';document.querySelector('#next').onclick=()=>{if(board===0){board=1;showBoard()}else{phase=2;showTask()}}}}
function showTask(){answered=false;let t=tasks[index];document.querySelector('#status').textContent=`${learned.size} / 10 Wörter geschafft`;app.innerHTML=progress(10+index)+`<div class="eyebrow">Runde 2 · Im Alltag · ${index+1} / 10</div><h2>Welches Wort passt?</h2><div class="context">${t.q.replace('___','<strong>…</strong>')}</div><div class="answers">${shuffle(t.o).map((o,i)=>`<button class="tile" data-option="${i}">${o}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><div id="continue"></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(answered)return;if(b.textContent!==t.a){mistakes++;b.disabled=true;feedback('Noch nicht. Lest den ganzen Satz und versucht es erneut.',false);return}answered=true;learned.add(t.id);b.classList.add('done');document.querySelectorAll('[data-option]').forEach(z=>z.disabled=true);document.querySelector('#status').textContent=`${learned.size} / 10 Wörter geschafft`;feedback('✓ '+t.why,true);document.querySelector('#continue').innerHTML='<button class="primary" id="next">'+(index===9?'Zum Ziel':'Weiter')+'</button>';document.querySelector('#next').onclick=()=>{index++;if(index===10)end();else showTask()}})}
function end(){phase=3;app.innerHTML=progress(20)+`<div class="eyebrow">Mission geschafft</div><h1>Zehn Wörter.<br>Gemeinsam geschafft.</h1><p class="lead">Ihr habt alle Wortpaare gefunden und alle Situationen gelöst.</p><div class="collection">${words.map(x=>`<span>✓ ${x.w}</span>`).join('')}</div><h2>Noch eine kleine Herausforderung?</h2><p>Wählt zwei Wörter. Bildet zusammen einen Satz, in dem beide vorkommen.</p><button class="primary" id="again">Noch einmal spielen</button>`;document.querySelector('#again').onclick=()=>{phase=0;board=0;index=0;learned=new Set();mistakes=0;document.querySelector('#status').textContent='Gemeinsam ans Ziel';start()}}
const dialog=document.querySelector('#dialog');document.querySelector('#listBtn').onclick=()=>{document.querySelector('#vocab').innerHTML=words.map(x=>`<div class="vocabrow"><b>${x.w}</b>${x.d}</div>`).join('');dialog.showModal()};document.querySelector('#close').onclick=()=>dialog.close();start();
</script></body></html>
